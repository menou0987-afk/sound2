
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound</title>

    <link rel="stylesheet" href="sound.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>

    <main id="music-list">

        <div id="add-music-area">
            <button id="add-music">＋ 曲を追加</button>
            <input type="file" id="music-files" multiple hidden>
        </div>

        <div id="song-list"></div>

    </main>

    <footer id="player">

        <div id="current-song">
            未選択
        </div>

        <div id="controls">

            <button id="repeat" title="1曲リピート">🔁</button>
            <button id="prev" title="前の曲">⏮︎</button>
            <button id="play" title="再生・一時停止"></button>
            <button id="next" title="次の曲">⏭︎</button>

        </div>

    </footer>

    <audio id="audio"></audio>

    <script src="sound.js"></script>
</body>
</html>
